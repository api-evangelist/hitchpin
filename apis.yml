aid: hitchpin
name: HitchPin
description: >-
  HitchPin is an online marketplace for the agriculture and rural economy, connecting
  farmers, ranchers, and rural businesses to buy and sell hay and forage, grain, cattle
  and livestock, farm and ranch equipment, trailers, land, and custom agricultural
  services. Sellers operate branded storefronts, send instant invoices, and collect
  payment, while buyers browse and purchase listings across the United States. HitchPin
  publishes public OpenAPI 3.1 definitions for its marketplace and instant-invoicing
  service, a receipt-rendering service, and a URL-shortcode service on GitHub. The
  company is backed by Foundry Group.
